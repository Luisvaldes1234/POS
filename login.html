<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F8F9FA">
<meta name="description" content="Acceso al punto de venta en mostrador.">
<title>POS Mostrador · Iniciar sesión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--primary:#0F766E;--primary-dark:#0D5C56;--primary-soft:#E6F2F1;--accent:#E07A5F;--bg:#F8F9FA;--surface:#fff;--text:#1A1A1A;--muted:#64748B;--border:#E2E8F0;--danger:#B42318;--success:#047857}
  html,body{min-height:100%;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--text);background:var(--bg)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;max-width:400px;width:100%;box-shadow:0 1px 2px rgba(16,24,40,.05),0 12px 32px -12px rgba(16,24,40,.12)}
  @media(max-width:480px){.card{padding:28px 20px}}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--primary-dark)}
  .logo svg{width:32px;height:32px}
  .sub{font-size:14px;color:var(--muted);text-align:center;margin-top:8px;margin-bottom:28px}
  label{font-size:13px;font-weight:500;color:var(--text);display:block;margin-bottom:6px}
  input,select{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;color:var(--text);font-size:15px;font-family:inherit;outline:none;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:#94A3B8}
  input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
  button{width:100%;padding:13px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  button:hover:not(:disabled){background:var(--primary-dark)}
  button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{font-size:13.5px;text-align:center;margin-top:14px;min-height:18px;line-height:1.5}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--success)}
  .foot{font-size:14px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.8}
  .foot a{color:var(--primary);font-weight:600;text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .foot a.back{color:var(--muted);font-weight:500}
  .legal{font-size:12px;color:#94A3B8;text-align:center;margin-top:16px}
</style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0F766E"/><g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M112 196 L140 120 H372 L400 196"/><path d="M112 196 a36 36 0 0 0 72 0 a36 36 0 0 0 72 0 a36 36 0 0 0 72 0 a36 36 0 0 0 72 0"/><path d="M136 244 V392 H376 V244"/><path d="M220 392 V316 H292 V392"/></g></svg>POS Mostrador</div>
    <div class="sub">Iniciá sesión para abrir tu caja</div>

    <label for="email">Email</label>
    <input id="email" type="email" name="email" autocomplete="username" required placeholder="cajero@tienda.com">

    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required placeholder="••••••••">

    <button type="submit" id="btn">Ingresar</button>
    <div class="msg" id="msg"></div>
    <div class="foot">¿No tenés cuenta? <a href="signup.html">Creá una gratis</a><br>
      <a class="back" href="index.html">← Volver al inicio</a></div>
    <div class="legal">POS Mostrador by TMV Dynamics S.A.&nbsp;de&nbsp;C.V.</div>
  </form>

<script src="js/pais.js?v=1"></script>
<script>
  // Textos con "tú" fuera de Argentina y Uruguay.
  (function () { const P = window.PosPais; if (P && !P.PAISES[P.detectarPais()].voseo) P.aplicarTuteo(document.body); })();
</script>
<script>
  const SB_URL = 'https://zgdrvptneiwlxlaywfur.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnZHJ2cHRuZWl3bHhsYXl3ZnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDU4NDgsImV4cCI6MjA5MDUyMTg0OH0.r1BR_OruT95Ks_xdkvlnuSqT8Lm-Vh6usJhgdLcV_Ig';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  // Si ya hay sesión, ir directo al POS.
  sb.auth.getSession().then(({ data }) => {
    if (data?.session) window.location.replace('app.html');
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { msg.className = 'msg err'; msg.textContent = 'Completá email y contraseña'; return; }
    btn.disabled = true; btn.textContent = 'Ingresando…';
    msg.className = 'msg'; msg.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      btn.disabled = false; btn.textContent = 'Ingresar';
      msg.className = 'msg err';
      msg.textContent = /invalid/i.test(error.message) ? 'Email o contraseña incorrectos' : error.message;
      return;
    }
    msg.className = 'msg ok'; msg.textContent = '✓ Acceso correcto, abriendo POS…';
    window.location.replace('app.html');
  });
</script>
</body>
</html>
